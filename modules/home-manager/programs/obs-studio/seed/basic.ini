[General]
Name=Streaming

[Output]
Mode=Simple

# Aitum Multistream encodes once with the main OBS encoder and reuses it for
# the additional horizontal destinations. 6000 kbps is Twitch's recommended
# upper range for 1080p60; lower this if the available upload is insufficient.
[SimpleOutput]
VBitrate=6000
ABitrate=160
UseAdvanced=false
Preset=veryfast
NVENCPreset2=p5
StreamEncoder=nvenc
RecQuality=Stream
RecFormat2=hybrid_mp4
RecEncoder=nvenc
RecTracks=1
FilePath=@HOME@/Videos

[Video]
BaseCX=1920
BaseCY=1080
OutputCX=1920
OutputCY=1080
FPSType=0
FPSCommon=60
ScaleType=bicubic
ColorFormat=NV12
ColorSpace=709
ColorRange=Partial

[Audio]
SampleRate=48000
ChannelSetup=Stereo
