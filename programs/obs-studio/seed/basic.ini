[General]
Name=Streaming

[Output]
Mode=Simple
FilenameFormatting=%CCYY-%MM-%DD %hh-%mm-%ss
DelayEnable=false
DelaySec=20
DelayPreserve=true
Reconnect=true
RetryDelay=2
MaxRetries=25
BindIP=default
IPFamily=IPv4+IPv6
NewSocketLoopEnable=false
LowLatencyEnable=false

# Aitum Multistream encodes once with the main OBS encoder and reuses it for
# the additional horizontal destinations. 6000 kbps is Twitch's recommended
# upper range for 1080p60; lower this if the available upload is insufficient.
[SimpleOutput]
VBitrate=6000
ABitrate=160
UseAdvanced=false
Preset=veryfast
NVENCPreset2=p5
StreamEncoder=nvenc
RecQuality=Stream
RecFormat2=hybrid_mp4
RecEncoder=nvenc
RecTracks=1
FilePath=@HOME@/Videos
RecRB=false
RecRBTime=20
RecRBSize=512
RecRBPrefix=Replay
StreamAudioEncoder=aac
RecAudioEncoder=aac
VodTrackEnabled=false

[Video]
BaseCX=1920
BaseCY=1080
OutputCX=1920
OutputCY=1080
FPSType=0
FPSCommon=60
ScaleType=bicubic
ColorFormat=NV12
ColorSpace=709
ColorRange=Partial
FPSInt=30
FPSNum=30
FPSDen=1
SdrWhiteLevel=300
HdrNominalPeakLevel=1000

[Audio]
SampleRate=48000
ChannelSetup=Stereo
MonitoringDeviceId=default
MonitoringDeviceName=Default
MeterDecayRate=23.53
PeakMeterType=0

# Twitch Enhanced Broadcasting is enabled and uses the Aitum Vertical canvas
# as an additional video track. Disable it in Settings -> Stream if you do not
# want OBS to send the vertical canvas to Twitch.
[Stream1]
IgnoreRecommended=false
EnableMultitrackVideo=true
MultitrackVideoMaximumAggregateBitrateAuto=true
MultitrackVideoMaximumVideoTracksAuto=true
MultitrackExtraCanvas=0be1ae3c-3467-413e-9fb1-d905ec3c49c7

